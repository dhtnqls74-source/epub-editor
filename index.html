<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPUB Editor – Minimal</title>

<!-- CodeMirror -->
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>

<!-- JSZip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { margin:0; font-family:system-ui; }
header {
  height:48px; background:#222; color:#fff;
  display:flex; align-items:center; gap:10px;
  padding:0 12px;
}
#layout { display:flex; height:calc(100vh - 48px); }
#files {
  width:220px; border-right:1px solid #ddd;
  background:#f7f7f7; overflow:auto;
}
#files div {
  padding:6px 10px; cursor:pointer;
  font-family:monospace; font-size:13px;
}
#files div.active { background:#ddd; }
#editor { flex:1; }
.CodeMirror { height:100%; }
</style>
</head>

<body>

<header>
  📘 EPUB 최소 편집기
  <input type="file" accept=".epub" id="fileInput">
  <button id="saveBtn">💾 저장</button>
</header>

<div id="layout">
  <div id="files"></div>
  <div id="editor"><textarea id="code"></textarea></div>
</div>

<script>
let zip;
let currentPath = null;

const filesDiv = document.getElementById("files");
const editor = CodeMirror.fromTextArea(
  document.getElementById("code"),
  { mode:"xml", lineNumbers:true }
);

// EPUB 열기
fileInput.onchange = async e => {
  zip = await JSZip.loadAsync(e.target.files[0]);
  filesDiv.innerHTML = "";

  Object.keys(zip.files)
    .filter(f => f.endsWith(".xhtml") || f.endsWith(".html"))
    .forEach(path => {
      const div = document.createElement("div");
      div.textContent = path;
      div.onclick = () => openFile(path, div);
      filesDiv.appendChild(div);
    });
};

// 파일 열기
async function openFile(path, el) {
  document.querySelectorAll("#files div")
    .forEach(d => d.classList.remove("active"));
  el.classList.add("active");

  currentPath = path;
  const text = await zip.file(path).async("string");
  editor.setValue(text);
}

// 저장 버튼
saveBtn.onclick = async () => {
  if (!zip) return alert("EPUB 먼저 열어줘");
  if (currentPath) {
    zip.file(currentPath, editor.getValue());
  }
  const blob = await zip.generateAsync({ type:"blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "edited.epub";
  a.click();
};
</script>

</body>
</html>
